name: stocktaking

services:
  postgres:
    image: postgres:18-alpine
    container_name: stocktaking-postgres
    command: [ "postgres", "-p", "${DB_PORT:-5432}" ]
    environment:
      POSTGRES_DB: "${DB_NAME:-stocktaking}"
      POSTGRES_USER: "${DB_USER:-stocktaking}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-stocktaking} -d ${DB_NAME:-stocktaking} -p ${DB_PORT:-5432}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: db-migration/Dockerfile
    container_name: stocktaking-db-migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-stocktaking}"
      DB_USER: "${DB_USER:-stocktaking}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"

  app:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: stocktaking-web
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-stocktaking}"
      DB_USER: "${DB_USER:-stocktaking}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
