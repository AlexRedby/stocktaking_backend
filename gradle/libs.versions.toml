[versions]
apollo = "5.1.0"
dotenv = "1.1.3"
dependency-update = "0.61.0"
hikari-cp = "7.1.0"
hoplite = "2.9.0"
javassist = "3.33.0-GA"
jooq = "3.21.7"
koin = "4.2.2"
kotlin = "2.4.10"
kotlin-logging = "8.0.4"
kotlinx-serialization = "1.11.0"
ktor = "3.5.2"
liquibase = "5.0.4"
liquibase-slf4j = "5.1.0"
logback = "1.6.3"
mockk = "1.14.11"
postgresql = "42.7.13"
slf4j = "2.0.18"
testcontainers = "2.0.5"

[plugins]
apollo = { id = "com.apollographql.apollo", version.ref = "apollo" }
dependency-update = { id = "io.github.ben-manes.versions", version.ref = "dependency-update" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }

[libraries]
apollo-runtime = { group = "com.apollographql.apollo", name = "apollo-runtime", version.ref = "apollo" }
dotenv = { group = "io.github.klahap.dotenv", name = "dotenv", version.ref = "dotenv" }
hikari-cp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari-cp" }
hoplite-core = { group = "com.sksamuel.hoplite", name = "hoplite-core", version.ref = "hoplite" }
hoplite-hocon = { group = "com.sksamuel.hoplite", name = "hoplite-hocon", version.ref = "hoplite" }
javassist = { group = "org.javassist", name = "javassist", version.ref = "javassist" }
jooq = { group = "org.jooq", name = "jooq", version.ref = "jooq" }
jooq-codegen = { group = "org.jooq", name = "jooq-codegen", version.ref = "jooq" }
jooq-kotlin = { group = "org.jooq", name = "jooq-kotlin", version.ref = "jooq" }
jooq-meta = { group = "org.jooq", name = "jooq-meta", version.ref = "jooq" }
koin-ktor = { group = "io.insert-koin", name = "koin-ktor", version.ref = "koin" }
koin-logger-slf4j = { group = "io.insert-koin", name = "koin-logger-slf4j", version.ref = "koin" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-compression = { group = "io.ktor", name = "ktor-server-compression", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
ktor-server-status-pages = { group = "io.ktor", name = "ktor-server-status-pages", version.ref = "ktor" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }
liquibase = { group = "org.liquibase", name = "liquibase-core", version.ref = "liquibase" }
liquibase-slf4j = { group = "com.mattbertolini", name = "liquibase-slf4j", version.ref = "liquibase-slf4j" }
logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
mockk = { group = "io.mockk", name = "mockk-jvm", version.ref = "mockk" }
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
testcontainers-postregesql = { group = "org.testcontainers", name = "testcontainers-postgresql", version.ref = "testcontainers" }
